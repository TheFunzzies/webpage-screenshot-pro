<!doctype html>
<!-- A long page: full-screen hero (100vh), native lazy images, images that a
     script only loads when scrolled into view, and a footer marker. -->
<html><head><meta charset="utf-8"><title>Lazy Fixture</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; }
  .hero { height: 100vh; display: grid; place-items: center; background: #1565c0; color: #fff; font-size: 40px; }
  section { height: 900px; padding: 20px 40px; box-sizing: border-box; border-bottom: 1px solid #ddd; }
  section img { width: 400px; height: 300px; display: block; }
</style></head>
<body>
  <div class="hero">HERO-MARKER</div>
  <div id="sections"></div>
  <footer style="padding:40px">FOOTER-MARKER</footer>
  <script>
    const host = document.getElementById('sections');
    for (let i = 1; i <= 40; i++) {
      const s = document.createElement('section');
      const native = i % 2 === 0;
      s.innerHTML = `<h2>SECTION-${i}</h2>` + (native
        ? `<img loading="lazy" src="generated/photo-${i}.jpg" alt="">`
        : `<img class="js-lazy" data-src="generated/photo-${i}.jpg" alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=">`);
      host.appendChild(s);
    }
    // A typical script lazy-loader: only swaps the image in once it's seen.
    const io = new IntersectionObserver((entries) => {
      for (const e of entries) if (e.isIntersecting) { e.target.src = e.target.dataset.src; io.unobserve(e.target); }
    });
    document.querySelectorAll('.js-lazy').forEach((img) => io.observe(img));
  </script>
</body></html>
