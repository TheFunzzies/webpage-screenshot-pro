<!doctype html>
<!-- Lots of code with a text shadow (like the Alpha Vantage docs), which
     makes Chrome's PDF engine crawl unless the shadows are dropped. -->
<html><head><meta charset="utf-8"><title>Shadows Fixture</title>
<style>
  body { margin: 0; padding: 20px 40px; font-family: system-ui, sans-serif; }
  code { display: block; white-space: pre; color: #c62828; background: #f5f5f5; text-shadow: 0 1px #fff; margin: 12px 0; }
  h1 { text-shadow: 2px 2px 4px #999; }
</style></head>
<body>
  <h1>Shadowed headline</h1>
  <div id="blocks"></div>
  <p>SHADOWS-END</p>
  <script>
    const host = document.getElementById('blocks');
    const line = "url = 'https://www.example.com/query?function=EXAMPLE&symbol=IBM&apikey=demo'\n";
    for (let i = 1; i <= 120; i++) {
      const c = document.createElement('code');
      c.textContent = `# block ${i}\n` + line.repeat(4);
      host.appendChild(c);
    }
  </script>
</body></html>
