<!doctype html>
<!-- A long article laid out the way older grid frameworks do it: the title,
     the article and the sidebar are inline-blocks side by side. Chrome won't
     split an inline-block across pages, so the article used to be pushed
     onto a page of its own, leaving blank pages before it. -->
<html><head><meta charset="utf-8"><title>Inline Grid Fixture</title>
<style>
  body { margin: 0; font: 16px/24px system-ui, sans-serif; }
  header { height: 150px; background: #1e3a8a; color: #fff; padding: 20px; box-sizing: border-box; }
  .grid { letter-spacing: -0.31em; margin: 0 30px; }
  .grid__item { display: inline-block; letter-spacing: normal; box-sizing: border-box; }
  .title { width: 100%; height: 400px; padding: 40px 0; font-size: 40px; line-height: 48px; vertical-align: middle; }
  .article { width: 62%; vertical-align: top; }
  .rail { display: inline-flex; width: 30%; margin-left: 8%; vertical-align: top; position: sticky; top: 0; }
  .rail div { width: 100%; height: 200px; background: #f59e0b; padding: 20px; }
  p { margin: 0; }
</style></head>
<body>
  <header>SITE-HEADER</header>
  <div class="grid">
    <div class="grid__item title">ARTICLE-TITLE</div>
    <div class="grid__item article" id="article"></div>
    <aside class="grid__item rail"><div>SIDEBAR-BOX</div></aside>
  </div>
  <script>
    const article = document.getElementById('article');
    const lines = ['ARTICLE-START'];
    for (let i = 1; i < 950; i++) lines.push(`Paragraph ${i} of the article.`);
    lines.push('ARTICLE-END');
    article.innerHTML = lines.map((t) => `<p>${t}</p>`).join('');
  </script>
</body></html>
