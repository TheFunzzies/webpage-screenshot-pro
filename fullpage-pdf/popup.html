<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #ffffff; --fg: #1f1f1f; --muted: #5f6368; --line: #dadce0;
      --accent: #c5221f; --accent-hover: #a50e0e; --ok: #188038; --err: #d93025;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #202124; --fg: #e8eaed; --muted: #9aa0a6; --line: #3c4043;
        --accent: #f28b82; --accent-hover: #f6aea9; --ok: #81c995; --err: #f28b82;
      }
    }
    body { margin: 0; width: 280px; background: var(--bg); color: var(--fg);
           font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { padding: 14px 16px 16px; display: grid; gap: 12px; }
    h1 { margin: 0; font-size: 15px; font-weight: 600; }
    label.field { display: grid; gap: 4px; color: var(--muted); font-size: 12px; }
    select { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px;
             background: var(--bg); color: var(--fg); }
    .checks { display: grid; gap: 6px; }
    .checks label { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
    .checks input { margin: 2px 0 0; }
    .hint { color: var(--muted); font-size: 11.5px; }
    button { font: inherit; font-weight: 600; padding: 9px 12px; border: 0; border-radius: 6px; cursor: pointer;
             background: var(--accent); color: var(--bg); }
    button:hover:not(:disabled) { background: var(--accent-hover); }
    button:disabled { opacity: .6; cursor: default; }
    [hidden] { display: none !important; }
    #tip { padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); font-size: 12px; }
    #tip p { margin: 0 0 8px; }
    .tip-buttons { display: flex; justify-content: flex-end; gap: 8px; }
    .tip-buttons button { padding: 6px 10px; font-size: 12px; }
    #progress { display: grid; gap: 8px; }
    .ptop { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; }
    #ppct { color: var(--muted); font-variant-numeric: tabular-nums; }
    .track { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
    #bar { height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width .2s; }
    .busy #bar { width: 35% !important; animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(290%); } }
    button.secondary { background: transparent; color: var(--fg); border: 1px solid var(--line); font-weight: 500; }
    button.secondary:hover:not(:disabled) { background: var(--line); }
    .field .hint { margin-top: -1px; }
    .folder { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
    .folder-row { display: flex; align-items: center; gap: 8px; color: var(--fg); }
    #folderText { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #folderInput { flex: 1; min-width: 0; font: inherit; padding: 5px 7px; border: 1px solid var(--line);
                   border-radius: 6px; background: var(--bg); color: var(--fg); }
    .folder-row button { padding: 5px 10px; font-size: 12px; }
    .actions { display: flex; gap: 8px; }
    .actions #go { flex: 1; }
    #nameExample { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #saveAll { width: 100%; }
    details#more { border-top: 1px solid var(--line); padding-top: 8px; }
    details#more summary { cursor: pointer; color: var(--muted); font-size: 12px; }
    .more { display: grid; gap: 12px; margin-top: 10px; }
    .dev { border-top: 1px dashed var(--line); padding-top: 10px; }
    .dev button { justify-self: start; padding: 6px 10px; font-size: 12px; }
    #batchLine { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #status { min-height: 1.4em; font-size: 12px; color: var(--muted); }
    #status.ok { color: var(--ok); }
    #status.err { color: var(--err); }
  </style>
</head>
<body>
  <main>
    <h1>Webpage Screenshot Pro</h1>
    <div id="tip" hidden>
      <p>Your last PDF was mostly photos. <strong>Compression</strong> can make files like that up to 90% smaller.</p>
      <div class="tip-buttons">
        <button id="tipNo" class="secondary">No thanks</button>
        <button id="tipYes">Use Medium</button>
      </div>
    </div>
    <label class="field">Capture
      <select id="mode">
        <option value="full">Full page</option>
        <option value="visible">Visible area</option>
        <option value="region">Region (drag to select)</option>
      </select>
    </label>
    <label class="field">Save as
      <select id="format">
        <option value="pdf">PDF (searchable text)</option>
        <option value="jpeg">JPEG image</option>
        <option value="png">PNG image</option>
      </select>
    </label>
    <label class="field" data-show="pdf full">Layout
      <select id="layout">
        <option value="single">One long page (like a screenshot)</option>
        <option value="letter">Letter pages</option>
        <option value="a4">A4 pages</option>
      </select>
    </label>
    <label class="field" data-show="pdf">Compression
      <select id="compression">
        <option value="off">Off (original images)</option>
        <option value="light">Light</option>
        <option value="medium">Medium</option>
        <option value="high">High (smallest file)</option>
      </select>
      <span class="hint" id="compressionHint"></span>
    </label>
    <div class="checks">
      <label data-show="pdf full"><input type="checkbox" id="stamp">
        <span>Add page address and date<br><span class="hint">A small header and footer on every page.</span></span></label>
      <label data-show="full"><input type="checkbox" id="loadLazy">
        <span>Load the whole page first<br><span class="hint">Scrolls through so lazy images appear.</span></span></label>
      <label data-show="full"><input type="checkbox" id="hideFloating">
        <span>Hide floating elements<br><span class="hint">Removes chat bubbles and cookie banners; pinned headers and sidebars appear once.</span></span></label>
    </div>
    <div class="actions">
      <button id="go">Save</button>
      <button id="copy" class="secondary" title="Copy to the clipboard as an image">Copy</button>
    </div>
    <button id="saveAll" class="secondary" data-show="full" title="Save every open tab in this window, one after another">Save all tabs</button>
    <details id="more">
      <summary>More settings</summary>
      <div class="more">
        <div class="folder">Save to
          <div class="folder-row" id="folderView">
            <span id="folderText"></span>
            <button id="folderChange" class="secondary">Change</button>
          </div>
          <div class="folder-row" id="folderEdit" hidden>
            <input id="folderInput" type="text" placeholder="Leave empty for Downloads" spellcheck="false">
            <button id="folderDone">Done</button>
          </div>
          <span class="hint" id="folderHint" hidden>A folder inside Downloads. Use / for subfolders.</span>
        </div>
        <label class="field">File name
          <select id="nameFormat">
            <option value="title-date">Page title + date</option>
            <option value="title-datetime">Page title + date + time</option>
            <option value="site-title-date">Site + page title + date</option>
            <option value="title">Page title only</option>
          </select>
          <span class="hint" id="nameExample"></span>
        </label>
        <div class="checks dev">
          <label><input type="checkbox" id="debugLog">
            <span>Debug logging<br><span class="hint">Records every step, with page addresses, to help track down problems. Errors are always recorded.</span></span></label>
          <button id="viewLogs" class="secondary">View logs</button>
        </div>
      </div>
    </details>
    <div id="progress" hidden>
      <div id="batchLine" hidden></div>
      <div class="ptop"><span id="ptext">Starting…</span><span id="ppct"></span></div>
      <div class="track"><div id="bar"></div></div>
      <button id="stop" class="secondary">Stop</button>
    </div>
    <div id="status" role="status"></div>
  </main>
  <script src="settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
